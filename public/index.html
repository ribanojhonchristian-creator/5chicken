<!-- Inside your HTML table where products are loaded -->
<script>
async function loadProducts() {
    const res = await fetch('/api/products');
    const products = await res.json();
    const tableBody = document.getElementById('product-table-body'); // Replace with your table body ID
    
    tableBody.innerHTML = '';
    products.forEach(p => {
        const status = p.stock_level <= p.low_stock_threshold ? 'Low Stock' : 'In Stock';
        tableBody.innerHTML += `
            <tr>
                <td>${p.item_code}</td>
                <td>${p.item_name}</td>
                <td>₱${p.unit_price.toFixed(2)}</td>
                <td>${p.stock_level}</td>
                <td>${status}</td>
                <td>
                    <button onclick="buyProduct(${p.product_id})" style="background:#22c55e; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">
                        Buy (1)
                    </button>
                </td>
            </tr>
        `;
    });
}

async function buyProduct(productId) {
    const res = await fetch('/api/sell', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product_id: productId, quantity: 1 })
    });
    const data = await res.json();
    if (data.success) {
        loadProducts(); // Refresh table instantly to show reduced stock
    } else {
        alert(data.message);
    }
}

loadProducts();
</script>
