<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 STAR Chicken Inventory System</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }
    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      color: var(--accent);
      font-size: 24px;
      margin: 0;
    }
    .meta {
      font-size: 14px;
      color: var(--text-muted);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background-color: #0f172a;
      color: var(--accent);
    }
    tr:hover {
      background-color: #273548;
    }
    .badge {
      background: #ef4444;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status-badge {
      background: #22c55e;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>5 STAR Chicken Inventory System</h1>
        <div class="meta">Section: BSIT/LFSA211A015</div>
      </div>
      <div>
        <span class="status-badge" id="system-status">Checking Status...</span>
      </div>
    </header>

    <h3>Live Inventory Products</h3>
    <table id="product-table">
      <thead>
        <tr>
          <th>Item Code</th>
          <th>Product Name</th>
          <th>Unit Price (₱)</th>
          <th>Stock Level</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5" style="text-align:center;">Loading products from server...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Fetch system status and products from backend API
    fetch('/')
      .then(res => res.json())
      .then(data => {
        document.getElementById('system-status').innerText = data.status;
      });

    fetch('/api/products')
      .then(res => res.json())
      .then(products => {
        const tbody = document.querySelector('#product-table tbody');
        tbody.innerHTML = '';
        products.forEach(p => {
          const isLow = p.stock_level <= p.low_stock_threshold;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${p.item_code}</td>
            <td>${p.item_name}</td>
            <td>₱${p.unit_price}</td>
            <td>${p.stock_level}</td>
            <td>${isLow ? '<span class="badge">Low Stock</span>' : '<span style="color:#22c55e;">In Stock</span>'}</td>
          `;
          tbody.appendChild(tr);
        });
      });
  </script>
</body>
</html>
